AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  TrustReview - proof-of-visit reviews for local businesses.
  DynamoDB (Businesses, Tokens w/ TTL, Reviews, Summaries), Cognito user pool,
  API Gateway HTTP API with JWT auth, Lambda handlers, EventBridge-driven
  risk scoring and Bedrock summarisation.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: CORS origin allowed to call the API. Tighten to the deployed frontend URL after first deploy.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: >
      Region to call Bedrock in. Bedrock is not enabled in every region
      (notably not always in ap-south-1), so this can point at a different
      region than the rest of the stack.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock model id. The original plan's claude-3-5-haiku-20241022 snapshot
      has since been retired; claude-haiku-4-5 is the current cheap/fast
      Haiku model. If your account requires an inference profile for
      on-demand throughput, use e.g. us.anthropic.claude-haiku-4-5-20251001-v1:0.
  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Email to notify on Lambda errors via SNS. Leave blank to create the
      alarms/topic without a subscription (subscribe an email later from the
      SNS console, or redeploy with this set).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        BUSINESSES_TABLE: !Ref BusinessesTable
        TOKENS_TABLE: !Ref TokensTable
        REVIEWS_TABLE: !Ref ReviewsTable
        SUMMARIES_TABLE: !Ref SummariesTable
        CONTACT_MESSAGES_TABLE: !Ref ContactMessagesTable
        EVENT_BUS_NAME: !Ref TrustReviewEventBus
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  # ---------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------
  BusinessesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: businessId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
      KeySchema:
        - AttributeName: businessId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerId-index
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: tokenId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: reviewId
          AttributeType: S
        - AttributeName: businessId
          AttributeType: S
        - AttributeName: authorId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: reviewId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: businessId-createdAt-index
          KeySchema:
            - AttributeName: businessId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: authorId-createdAt-index
          KeySchema:
            - AttributeName: authorId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SummariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: businessId
          AttributeType: S
      KeySchema:
        - AttributeName: businessId
          KeyType: HASH

  ContactMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: messageId
          KeyType: HASH

  # ---------------------------------------------------------------------
  # Cognito
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
          AttributeDataType: String

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Platform moderators who can see and hide flagged reviews.

  # ---------------------------------------------------------------------
  # EventBridge
  # ---------------------------------------------------------------------
  TrustReviewEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${AWS::StackName}-events"

  # ---------------------------------------------------------------------
  # API Gateway HTTP API
  # ---------------------------------------------------------------------
  TrustReviewApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
      # Stage-wide throttle as a backstop against a runaway client or bug —
      # this is aggregate across all callers, not per-IP. AWS WAF does not
      # support direct association with API Gateway HTTP APIs (only REST
      # APIs, ALB, CloudFront, AppSync, Cognito) — real per-IP rate limiting
      # would need a CloudFront distribution in front of this API with WAF
      # attached there, which is a bigger change left for later.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  # ---------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/health.ts

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: contact.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactMessagesTable
      Events:
        Contact:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /contact
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/contact.ts

  CreateBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: createBusiness.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        CreateBusiness:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /businesses
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/createBusiness.ts

  GetMyBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: getMyBusiness.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
      Events:
        GetMyBusiness:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /businesses/mine
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/getMyBusiness.ts

  ListBusinessesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: listBusinesses.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
      Events:
        ListBusinesses:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /businesses
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/listBusinesses.ts

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: getProfile.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SummariesTable
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /businesses/{id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/getProfile.ts

  GetReviewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: getReviews.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
      Events:
        GetReviews:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /businesses/{id}/reviews
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/getReviews.ts

  IssueTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: issueToken.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TokensTable
      Events:
        IssueToken:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /businesses/{id}/tokens
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/issueToken.ts

  RedeemTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: redeemToken.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
      Events:
        RedeemToken:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /tokens/{tokenId}/redeem
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/redeemToken.ts

  SubmitReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: submitReview.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BusinessesTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref TrustReviewEventBus
      Events:
        SubmitReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /reviews
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/submitReview.ts

  RespondToReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: respondToReview.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
      Events:
        RespondToReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /reviews/{id}/response
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/respondToReview.ts

  AdminListFlaggedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: adminListFlagged.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
      Events:
        AdminListFlagged:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /admin/flagged
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/adminListFlagged.ts

  AdminModerateReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: adminModerateReview.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
      Events:
        AdminModerateReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustReviewApi
            Path: /admin/reviews/{id}
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/adminModerateReview.ts

  RiskScorerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: riskScorer.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
      Events:
        ReviewCreated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref TrustReviewEventBus
            Pattern:
              source: ["trustreview.reviews"]
              detail-type: ["ReviewCreated"]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/riskScorer.ts

  SummariseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: summarise.handler
      Timeout: 30
      Environment:
        Variables:
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SummariesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBReadPolicy:
            TableName: !Ref BusinessesTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
      Events:
        ReviewCreated:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref TrustReviewEventBus
            Pattern:
              source: ["trustreview.reviews"]
              detail-type: ["ReviewCreated"]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "node22"
        Sourcemap: false
        EntryPoints:
          - src/handlers/summarise.ts

  # ---------------------------------------------------------------------
  # Ops: error alarms on the Lambdas that sit on the core money path
  # (redeem, submit review, create business, issue token) plus the two
  # async workers. Subscribes AlertEmail if one was given; otherwise the
  # topic and alarms still exist and can be subscribed to later.
  # ---------------------------------------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RedeemTokenErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-RedeemToken-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RedeemTokenFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  SubmitReviewErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-SubmitReview-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SubmitReviewFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  CreateBusinessErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-CreateBusiness-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateBusinessFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  IssueTokenErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-IssueToken-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IssueTokenFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  RiskScorerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-RiskScorer-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RiskScorerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${TrustReviewApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  BusinessesTableName:
    Value: !Ref BusinessesTable
  TokensTableName:
    Value: !Ref TokensTable
  ReviewsTableName:
    Value: !Ref ReviewsTable
  SummariesTableName:
    Value: !Ref SummariesTable
  EventBusName:
    Value: !Ref TrustReviewEventBus
  Region:
    Value: !Ref AWS::Region
  AlertsTopicArn:
    Description: SNS topic for Lambda error alarms — subscribe an email to it if AlertEmail wasn't set at deploy time.
    Value: !Ref AlertsTopic
